name: Release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab). Produces:
#   - fieldscope-<ver>.tar.gz                       install bundle (source)
#   - fieldscope-<ver>-portable-<os>-<arch>.tar.gz  portable bundle per OS
#   - ghcr.io/<owner>/fieldscope:<ver> + :latest    container image
# and attaches the tarballs to a GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd server && npm ci
      - run: cd client && npm ci
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"
      - run: cd client && npm ci
      - name: Build install + linux portable bundles
        run: npm run package
      - name: Create/refresh the GitHub Release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Fieldscope $TAG" \
                 --notes "Fieldscope $TAG — read-only, evidence-first OT/IT/IIoT diagnostics workbench. See README for install & portable bundle usage." --verify-tag=false
          gh release upload "$TAG" release/*.tar.gz --clobber

  portable:
    needs: release
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd client && npm ci
        shell: bash
      - name: Build portable bundle for ${{ matrix.os }}
        run: npm run package:portable
        shell: bash
      - name: Upload portable bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" release/*-portable-*.tar.gz --clobber
        shell: bash

  windows-installer:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build client
        shell: bash
        run: cd client && npm ci && npm run build
      - name: Stage the app with the bundled Node runtime
        shell: pwsh
        run: |
          $stage = "packaging/windows/staging"
          New-Item -ItemType Directory -Force -Path "$stage/server", "$stage/client" | Out-Null
          Copy-Item server/src        "$stage/server/src" -Recurse
          Copy-Item server/rulepacks  "$stage/server/rulepacks" -Recurse
          Copy-Item server/index.js, server/package.json, server/package-lock.json "$stage/server/"
          Copy-Item client/dist       "$stage/client/dist" -Recurse
          Copy-Item README.md, LICENSE "$stage/"
          Copy-Item packaging/windows/fieldscope-launch.cmd "$stage/"
          # Production server deps (native better-sqlite3 for win-x64).
          Push-Location "$stage/server"; npm ci --omit=dev; Pop-Location
          # Bundle the runner's Node runtime so end users install nothing.
          Copy-Item (Get-Command node).Source "$stage/node.exe"
      - name: Compile the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = "${{ needs.release.outputs.tag }}" -replace '^v',''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging/windows/fieldscope.iss
      - name: Upload installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" packaging/windows/dist-installer/*.exe --clobber

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ needs.release.outputs.tag }}"
          docker build -t "$IMG:${TAG#v}" -t "$IMG:latest" .
          docker push "$IMG:${TAG#v}"
          docker push "$IMG:latest"
